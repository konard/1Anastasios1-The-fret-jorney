name: the_fret_journey
description: An educational app for guitarists that helps them learn the notes on the fretboard in an interactive way.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Audio recording and processing
  flutter_sound: ^9.2.13
  permission_handler: ^11.0.1

  # Pitch detection
  pitch_detector_dart: ^1.0.5

  # State management
  provider: ^6.1.1

  # Local storage
  shared_preferences: ^2.2.2

  # Firebase (optional, for cloud features)
  firebase_core: ^2.24.2
  firebase_auth: ^4.15.3
  firebase_database: ^10.4.0

  # UI enhancements
  cupertino_icons: ^1.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/sounds/
